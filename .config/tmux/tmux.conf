set -g escape-time 10
set -g focus-events on
set -a terminal-features "tmux-254color:RGB"
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 5
set -g status-left ""
set -g status-right ""
set -g status-style "bg=default"
set -g window-style "fg=colour244"
set -g window-active-style "fg=#d4be98"
set -g renumber-windows on
set -g base-index 1
set -g window-status-current-style "bg=default,fg=colour6,bold,noreverse"
set -g window-status-style "bg=default,fg=colour244"
set -g window-status-separator "    "
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc"
set -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}:#{b:pane_current_path}"

unbind C-b
set -g prefix C-a
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind g run "~/.config/scripts/open-github.sh"
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"
bind C-a send-prefix
# Ghostty sends these prefix commands for Cmd-T and Cmd-W.
bind c new-window -c "#{pane_current_path}"
bind '&' kill-pane

# Smart pane switching with awareness of Neovim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Open Claude left/right for the first panes, then split top/bottom.
bind-key -n C-n if-shell -F '#{>:#{window_panes},1}' \
    'split-window -v -c "#{pane_current_path}" /Users/maldee/.local/bin/claude' \
    'split-window -h -c "#{pane_current_path}" /Users/maldee/.local/bin/claude'

bind -T copy-mode-vi v			send -X begin-selection
bind -T copy-mode-vi y			send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter		send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi M-c send -X copy-pipe-and-cancel "pbcopy"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
